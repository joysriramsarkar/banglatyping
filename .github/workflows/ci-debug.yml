name: CI Debug (temporary)

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Report runner environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect diagnostics
        run: |
          {
            echo '### Runner diagnostics'
            echo '```'
            echo "node:            $(node -v 2>&1)"
            echo "npm:             $(npm -v 2>&1)"
            echo "which node:      $(which node 2>&1)"
            echo "which pnpm:      $(which pnpm 2>&1 || echo 'NOT FOUND')"
            echo "corepack:        $(corepack --version 2>&1 || echo 'NOT FOUND')"
            echo "which corepack:  $(which corepack 2>&1 || echo 'NOT FOUND')"
            echo "PATH=$PATH"
            echo ''
            echo '--- corepack prepare pnpm@11.24.0 --activate ---'
            corepack prepare pnpm@11.24.0 --activate 2>&1 || echo "[exit $?]"
            echo ''
            echo '--- corepack pnpm -v ---'
            corepack pnpm -v 2>&1 || echo "[exit $?]"
            echo ''
            echo '--- packageManager field ---'
            node -e "console.log(require('./package.json').packageManager)" 2>&1
            echo '```'
          } | tee diag.txt

      - name: Post diagnostics to PR
        run: gh pr comment "$PR_NUMBER" --body-file diag.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
