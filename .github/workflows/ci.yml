name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders so `next build` can compile without real secrets
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      SUPABASE_SERVICE_KEY: ci-service-key-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version tracks "engines" in package.json.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Integration tests
        run: npm run test:ci

      - name: Grapheme registry coverage
        run: npm run grapheme:coverage

      - name: Build
        run: npm run build

      - name: Bundle analysis (informational)
        # next/bundle-analyzer is not wired into next.config yet; until it is,
        # report the production output size. Informational only — never red.
        run: |
          echo "## .next size report" >> "$GITHUB_STEP_SUMMARY"
          du -sh .next 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          du -sh .next/static 2>/dev/null || true
        continue-on-error: true

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (full suite)
        # Serialize: the specs fight over the on-demand dev-server compile,
        # which otherwise trips the expect timeout when run in parallel.
        run: npx playwright test --project=chromium --workers=1
