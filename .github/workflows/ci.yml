name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders so `next build` can compile without real secrets
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      SUPABASE_SERVICE_KEY: ci-service-key-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version is read from the "packageManager" field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deliberately not using setup-node's `cache: pnpm`: it resolves the store
      # path before anything is installed, and fails on a fresh runner where that
      # directory does not exist yet. Cache it explicitly instead, creating the
      # directory first so the cache step always has a valid path.
      - name: Resolve pnpm store path
        shell: bash
        run: |
          STORE_PATH="$(pnpm store path)"
          mkdir -p "$STORE_PATH"
          echo "PNPM_STORE_PATH=$STORE_PATH" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build
