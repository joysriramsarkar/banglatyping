name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders so `next build` can compile without real secrets
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      SUPABASE_SERVICE_KEY: ci-service-key-placeholder
      # Corepack otherwise prompts before downloading pnpm, which fails on a
      # non-interactive runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm is driven through corepack, which ships with Node, and every step
      # calls `corepack pnpm` explicitly. This avoids depending on a separate
      # setup action leaving a pnpm binary on PATH for later steps, and on
      # setup-node's `cache: pnpm`, both of which failed on the runner.
      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Lint
        run: corepack pnpm run lint

      - name: Unit tests
        run: corepack pnpm run test:ci

      - name: Build
        run: corepack pnpm run build
